# Render Blueprint. Create one service per environment (staging, production) with separate
# Supabase projects and secrets. Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: boi-health-camp-staging
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_ENV
        value: staging
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: none
